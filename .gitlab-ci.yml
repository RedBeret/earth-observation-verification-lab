# Orchestration only. Every job calls a repository entrypoint, in the same order as the
# GitHub Actions workflow and the Jenkins pipeline, so the three definitions cannot
# drift apart.

stages:
  - static
  - environment
  - procedures
  - evidence

default:
  image: python:3.12.11-slim-bookworm
  interruptible: true
  before_script:
    - ./scripts/bootstrap.sh

variables:
  GIT_DEPTH: "0"
  DOCKER_DRIVER: overlay2

.artifacts: &artifacts
  when: always
  expire_in: 14 days
  paths:
    - artifacts/
  reports:
    junit: artifacts/junit/*.xml

static-verification:
  stage: static
  script:
    - ./scripts/terra.sh doctor
    - ./scripts/terra.sh validate
    - ./scripts/terra.sh traceability
    - ./scripts/terra.sh test unit
    # Static contract checks run before the environment exists.
    - ./scripts/terra.sh test contract --mode static
    - ./scripts/terra.sh test security
    - ./scripts/terra.sh test pipeline
  after_script:
    - ./scripts/terra.sh diagnostics
  artifacts: *artifacts

integration-environment:
  stage: environment
  needs: [static-verification]
  script:
    - ./scripts/terra.sh up
    - ./scripts/terra.sh status
    - ./scripts/terra.sh test integration
  after_script:
    - ./scripts/terra.sh diagnostics
    - ./scripts/terra.sh down
  artifacts: *artifacts

formal-procedures:
  stage: procedures
  needs: [static-verification]
  script:
    - ./scripts/terra.sh up
    - ./scripts/terra.sh status
    - ./scripts/terra.sh procedure run TP-ING-002
    - ./scripts/terra.sh procedure run TP-API-004
    - ./scripts/terra.sh procedure run TP-SYS-001
    # The Postman phase runs against the started system.
    - ./scripts/terra.sh test contract --mode postman
    - ./scripts/terra.sh test performance
    - ./scripts/terra.sh procedure run TP-RES-003
    - ./scripts/terra.sh test resilience
  after_script:
    - ./scripts/terra.sh diagnostics
    - ./scripts/terra.sh down
  artifacts: *artifacts

verification-evidence:
  stage: evidence
  needs: [integration-environment, formal-procedures]
  script:
    - ./scripts/terra.sh procedure run TP-EVD-005
    - ./scripts/terra.sh evidence
  after_script:
    - ./scripts/terra.sh diagnostics
    - ./scripts/terra.sh down
  artifacts: *artifacts
